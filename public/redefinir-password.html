<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir palavra-passe - Automercado</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      color: #222;
      font-size: 25px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #mensagem {
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Redefinir palavra-passe</h1>

    <p>
      Digite a sua nova palavra-passe abaixo.
    </p>

    <form id="reset-form">

      <label for="password">
        Nova palavra-passe
      </label>

      <input
        id="password"
        type="password"
        minlength="6"
        required
        placeholder="Mínimo 6 caracteres"
      >

      <label for="password2">
        Confirmar palavra-passe
      </label>

      <input
        id="password2"
        type="password"
        minlength="6"
        required
        placeholder="Digite novamente"
      >

      <button id="btn" type="submit">
        Alterar palavra-passe
      </button>

    </form>

    <div id="mensagem"></div>
  </div>

<script>
const form = document.getElementById("reset-form");
const mensagem = document.getElementById("mensagem");
const btn = document.getElementById("btn");

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

if (!token) {
  mensagem.textContent = "Link de recuperação inválido.";
  form.style.display = "none";
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const password2 = document.getElementById("password2").value;

  mensagem.textContent = "";

  if (password.length < 6) {
    mensagem.textContent =
      "A palavra-passe deve ter pelo menos 6 caracteres.";
    return;
  }

  if (password !== password2) {
    mensagem.textContent =
      "As palavras-passe não coincidem.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "A alterar...";

  try {
    const response = await fetch("/api/auth/reset-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        token: token,
        newPassword: password
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Não foi possível alterar a palavra-passe.");
    }

    mensagem.textContent =
      "Palavra-passe alterada com sucesso. Já podes iniciar sessão.";

    form.reset();

  } catch (error) {
    mensagem.textContent = error.message;
  }

  btn.disabled = false;
  btn.textContent = "Alterar palavra-passe";
});
</script>

</body>
</html>
