<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir palavra-passe - AutoMercado</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #b02a2a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #mensagem {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Nova palavra-passe</h1>

  <p>Define uma nova palavra-passe para a tua conta.</p>

  <form id="resetForm">

    <label for="password">Nova palavra-passe</label>

    <input
      id="password"
      type="password"
      minlength="6"
      required
      placeholder="Mínimo de 6 caracteres"
    >

    <label for="confirmPassword">Confirmar palavra-passe</label>

    <input
      id="confirmPassword"
      type="password"
      minlength="6"
      required
      placeholder="Repete a palavra-passe"
    >

    <button type="submit">
      Alterar palavra-passe
    </button>

  </form>

  <div id="mensagem"></div>

</div>

<script>
  const API_URL = "https://automercado-backend.onrender.com/api";

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  const form = document.getElementById("resetForm");
  const mensagem = document.getElementById("mensagem");

  if (!token) {
    form.style.display = "none";
    mensagem.textContent = "Link inválido ou sem token.";
  }

  form.addEventListener("submit", async function (event) {

    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (password.length < 6) {
      mensagem.textContent =
        "A palavra-passe deve ter pelo menos 6 caracteres.";
      return;
    }

    if (password !== confirmPassword) {
      mensagem.textContent =
        "As palavras-passe não coincidem.";
      return;
    }

    mensagem.textContent = "A atualizar...";

    try {

      const response = await fetch(
        `${API_URL}/auth/reset-password`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token: token,
            newPassword: password
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        mensagem.textContent =
          data.error || "Não foi possível alterar a palavra-passe.";
        return;
      }

      mensagem.textContent =
        "Palavra-passe alterada com sucesso! Já podes iniciar sessão.";

      form.style.display = "none";

    } catch (error) {

      console.error(error);

      mensagem.textContent =
        "Erro de ligação ao servidor. Tenta novamente.";
    }
  });
</script>

</body>
</html>
